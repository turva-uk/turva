# Dependency update policy. See https://github.com/pacharanero/house-style/blob/main/ci.md
#
# Cooldown gives a release time to be noticed, yanked, or superseded before it
# lands here. Cooldown does not apply to security updates, so urgent security
# fixes still arrive immediately.
#
# Note: Dependabot now applies a 3-day default cooldown even when unconfigured,
# so `default-days` is never set below 3 here. House style suggests a floor of
# 1 day, which would now weaken the platform default rather than strengthen it.
#
# Routine minor and patch updates are grouped into one weekly PR per ecosystem.
# Major updates stay separate so they get reviewed on their own merits.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directories:
      - "/api"
      - "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      pre-commit-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
