# Dependency update policy. See https://github.com/pacharanero/house-style/blob/main/ci.md
#
# Cooldown gives a release time to be noticed, yanked, or superseded before it
# lands here.
#
# IMPORTANT: cooldown is bypassed for security updates only if Dependabot
# *security updates* are enabled on the repository, which is a repository
# setting and not something this file controls. That setting was off until
# 2026-10-09, so the 7-day cooldown applied to security releases too - Django
# 6.1.2, a four-CVE security release, sat unraised for three days and was found
# by hand. Check it is still on:
#
#   gh api repos/turva-uk/turva --jq '.security_and_analysis.dependabot_security_updates.status'
#
# `default-days: 7` is set deliberately. Three sources disagree on the floor:
# house style suggests at least 1, Dependabot now applies 3 when unconfigured,
# and Zizmor's `dependabot-cooldown` audit fails anything under 7. We take the
# strictest, because a longer window is more time for a compromised or yanked
# release to be caught before it reaches a clinical safety tool, and because
# Zizmor is a blocking CI gate. Security updates ignore cooldown entirely, so
# urgent fixes are unaffected.
#
# Routine minor and patch updates are grouped into one weekly PR per ecosystem.
# Major updates stay separate so they get reviewed on their own merits.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directories:
      - "/app"
      - "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # Django 6.2 will be the LTS in this series and is the intended upgrade
      # target, so minor bumps within 6.x are welcome. A major bump to 7.x needs
      # deliberate review: it removes the deprecated email settings among other
      # APIs. `ignore` suppresses version updates only - security updates still
      # arrive.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dockerfiles. Now worth managing because the base images are pinned to exact
  # patch versions rather than floating tags.
  - package-ecosystem: "docker"
    directories:
      - "/app"
      - "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    ignore:
      # Patch bumps of the Python image (3.14.6 -> 3.14.7) are safe and welcome.
      # Minor and major bumps are not, for two reasons:
      #
      #  1. The dependency locks are compiled for a specific interpreter
      #     (`s/lock` passes --python-version). Changing the image without
      #     regenerating them installs a resolution nobody tested. That is a code
      #     change, not a version bump.
      #  2. Dependabot offers pre-release tags. Its first attempt here proposed
      #     `python:3.15.0rc2-slim`, which failed CI because `brotli` has no
      #     cp315 wheel and the slim image has no compiler - so it tried to build
      #     from source. A release candidate interpreter has no business in a
      #     clinical safety tool regardless of whether it happens to build.
      - dependency-name: "python"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # PostgreSQL major upgrades need a dump/restore, not a tag bump, so major
  # updates are intentionally left to arrive as their own reviewable PR.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      compose-images-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      pre-commit-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
