name: Non-main branch workflows

on:
  push:
    branches-ignore: [main, master]
  pull_request:
    branches-ignore: [main, master]

permissions:
  contents: read

concurrency:
  group: nonmain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  styling:
    name: Styling (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRE_COMMIT_HOME: ${{ github.workspace }}/.pre-commit-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Cache pre-commit and venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
            ${{ env.PRE_COMMIT_HOME }}
            ${{ env.PIP_CACHE_DIR }}
          key: pc-styling-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pc-styling-${{ runner.os }}-py3.14-
            pc-styling-${{ runner.os }}-

      - name: Ensure venv and pre-commit
        run: |
          if [ ! -x .venv/bin/pre-commit ]; then
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install -U pip
            python -m pip install "pre-commit>=3,<5"
          else
            echo "Using cached .venv with pre-commit."
          fi

      - name: Warm pre-commit hooks
        run: |
          . .venv/bin/activate
          pre-commit install-hooks

      - name: Run pre-commit
        run: |
          . .venv/bin/activate
          pre-commit run --all-files --show-diff-on-failure --color=always

  safety-file:
    name: Safety file storage layer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # No database and no container needed: this package has no framework
      # dependency by design (ADR 0001), so it is tested on its own and fails
      # fast when the storage core breaks.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r safety_file/requirements.in

      - name: Run tests
        run: python -m pytest safety_file -q

  tests:
    name: Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Copy CI/CD env file
        run: cp app/.env.cicd app/.env

      # No sleep needed: compose waits for the postgres healthcheck.
      - name: Build and start Docker containers
        run: docker compose up -d --wait

      - name: Apply migrations
        run: docker compose exec -T web python manage.py migrate --noinput

      # Runs with DEBUG=false, so this exercises the manifest static storage
      # that deployment uses rather than leaving it only tested in production.
      - name: Collect static files
        run: docker compose exec -T web python manage.py collectstatic --noinput

      # Django's own deployment audit: missing security headers, insecure
      # cookies, a weak secret key, DEBUG left on. Blocking, because every
      # finding is one that matters on a VPS serving NHS organisations.
      #
      # Run with production-like inputs rather than the CI env file. The point
      # is to prove that settings.py produces a secure configuration when
      # deployed, not to audit CI's own throwaway values - CI deliberately uses
      # the in-memory mail backend and non-secure cookies because it drives the
      # test client over plain HTTP.
      - name: Deployment checks
        run: |
          docker compose exec -T \
            -e DEBUG=false \
            -e SECRET_KEY='deploy-check-only-aG7xK2mQ9pLvR4nZ8wYtB6cJ3hD5sF1eU0iO7rT2yA' \
            -e SESSION_COOKIE_SECURE=true \
            -e CSRF_COOKIE_SECURE=true \
            -e EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend \
            web python manage.py check --deploy --fail-level WARNING

      # The whole suite, against PostgreSQL. The previous FastAPI suite ran on
      # SQLite, which is why a PostgreSQL connection regression reached main with
      # every test green.
      - name: Run tests
        run: docker compose exec -T web pytest -v

      - name: Build the demo safety file
        # Exercises the storage layer end to end inside the application
        # container, including git running as the non-root container user.
        run: docker compose exec -T web python demo/build.py /tmp/demo-safety-file --force

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup containers
        if: always()
        run: docker compose down -v
