name: Non-main branch workflows

on:
  push:
    branches-ignore: [main, master]
  pull_request:
    branches-ignore: [main, master]

permissions:
  contents: read

concurrency:
  group: nonmain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  styling:
    name: Styling (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRE_COMMIT_HOME: ${{ github.workspace }}/.pre-commit-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache pre-commit and venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
            ${{ env.PRE_COMMIT_HOME }}
            ${{ env.PIP_CACHE_DIR }}
          key: pc-styling-${{ runner.os }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pc-styling-${{ runner.os }}-py3.13-
            pc-styling-${{ runner.os }}-

      - name: Ensure venv and pre-commit
        run: |
          if [ ! -x .venv/bin/pre-commit ]; then
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install -U pip
            python -m pip install "pre-commit>=3,<5"
          else
            echo "Using cached .venv with pre-commit."
          fi

      - name: Warm pre-commit hooks
        run: |
          . .venv/bin/activate
          pre-commit install-hooks

      - name: Run pre-commit
        run: |
          . .venv/bin/activate
          pre-commit run --all-files --show-diff-on-failure --color=always

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - name: Copy CI/CD env file
        run: cp api/.env.cicd api/.env

      - name: Build and start Docker containers
        run: docker compose up -d --build

      - name: Wait for containers to be ready
        run: sleep 5

      # Integration tests are included. They were previously excluded and had
      # silently rotted: every one of them 404'd inside the container because
      # .env.test could not override the compose-injected api/.env.
      - name: Run pytest in Docker container
        run: docker compose exec -T api pytest /app/src -v

      - name: Cleanup containers
        if: always()
        run: docker compose down -v
