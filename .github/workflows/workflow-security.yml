name: Workflow security

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install-action downloads the upstream release binary and verifies its
      # checksum. `fallback: none` stops it silently switching to cargo-binstall
      # or a source build.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor@1.30.1
          fallback: none

      # Default `regular` persona: high-signal findings only. `pedantic` and
      # `auditor` deliberately include code smells and are for manual review.
      - run: zizmor --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}
