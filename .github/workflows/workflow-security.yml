name: Workflow security

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install-action downloads the upstream release binary and verifies its
      # checksum. `fallback: none` stops it silently switching to cargo-binstall
      # or a source build.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          # This version is the single source of truth: `s/lint` reads it from
          # this file so the local gate cannot drift from CI.
          #
          # Dependabot keeps the `uses:` SHA above current, but cannot see this
          # input - it is an action parameter, not a dependency manifest - so a
          # new Zizmor release will not be proposed. Check it by hand when
          # reviewing the Actions bumps:
          #
          #   gh api repos/zizmorcore/zizmor/releases/latest --jq .tag_name
          #
          # Pinned deliberately rather than tracking latest, so a new audit rule
          # arrives through a reviewed bump instead of turning main red without
          # warning.
          tool: zizmor@1.30.1
          fallback: none

      # Default `regular` persona: high-signal findings only. `pedantic` and
      # `auditor` deliberately include code smells and are for manual review.
      - run: zizmor --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}
