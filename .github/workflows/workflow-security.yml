name: Workflow security

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # PyYAML is already a direct storage dependency and in the application
      # lock. Install only that constrained package, not the Django stack.
      - name: Install the locked YAML parser
        run: |
          python -m pip install --only-binary=:all: -c app/requirements.txt PyYAML

      # One pin for the hook and CI: the zizmor hook's `rev` in
      # .pre-commit-config.yaml. Dependabot's pre-commit updates bump it, which
      # it could not do while the version was an input to the step below.
      - name: Read the pinned zizmor version
        id: zizmor
        run: |
          version="$(bash s/checks/hook-version https://github.com/zizmorcore/zizmor-pre-commit)"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      # install-action downloads the upstream release binary and verifies its
      # checksum. `fallback: none` stops it silently switching to cargo-binstall
      # or a source build.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: zizmor@${{ steps.zizmor.outputs.version }}
          fallback: none

      # The pre-commit hook runs the same audits offline. This run has the
      # job's token, so it also runs the audits that ask GitHub.
      # Default `regular` persona: high-signal findings only. `pedantic` and
      # `auditor` deliberately include code smells and are for manual review.
      - run: zizmor --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}
