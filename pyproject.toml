# Tooling configuration for the repository.
#
# Ruff is configured separately in ruff.toml, which is the single source of
# truth for lint and format. Do not add a [tool.ruff] section here.

# A [project] table exists only so uv can manage the host development
# lint environment. The dev group is for pre-commit, not the host test suite;
# see DEVELOPMENT.md for isolated installation. The repository is not packaged
# or installed: the application's own dependencies live in app/requirements*.in
# and their committed locks, which `s/lock` regenerates.
[project]
name = "turva"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
# DJANGO_SETTINGS_MODULE is deliberately NOT set here. This file is shared with
# the `safety_file` suite, which has no Django dependency by design (ADR 0001)
# and runs on the host where pytest-django is not installed - it would warn
# "Unknown config option" on every run. The application container sets
# DJANGO_SETTINGS_MODULE as an environment variable instead, which pytest-django
# reads.
#
# Both suites live under the repository root: `safety_file` needs no database,
# `app` does. pytest-django only creates a database for tests that ask for one.
testpaths = ["safety_file", "app"]
python_files = ["test_*.py"]
# `--import-mode=importlib` avoids needing __init__.py gymnastics for test
# packages that share module names across directories.
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["app", "safety_file"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/config/wsgi.py",
  "manage.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# Read by the mypy pre-commit hook, and by a bare `mypy`. Strict, and only
# over safety_file/ for now. safety_file/ imports no web framework, so mypy
# checks it without Django's type stubs. app/ needs those stubs installed
# beside mypy, so it is not checked yet.
[tool.mypy]
python_version = "3.14"
strict = true
files = ["safety_file"]

# The tests are still type-checked, but their functions need no annotations
# yet: 134 of them had none when mypy was added. Once they are annotated,
# this override goes. GitHub issue https://github.com/turva-uk/turva/issues/117
# tracks that.
[[tool.mypy.overrides]]
module = "safety_file.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
