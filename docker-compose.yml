services:
  web:
    container_name: "turva-web"
    build:
      # Context is the repository root: the image needs both the Django project
      # and the safety_file library as sibling packages.
      context: .
      dockerfile: app/Dockerfile
    volumes:
      - ./app:/srv/app
      - ./safety_file:/srv/safety_file
      - ./safety-file-templates:/srv/safety-file-templates
      - ./demo:/srv/demo
      - ./manage.py:/srv/manage.py
      - ./pyproject.toml:/srv/pyproject.toml
      # Safety file repositories - the system of record.
      #
      # A bind mount, not a named volume, so the repositories are visible on the
      # host: you can `cd .turva-data/safety-files/<slug>` and run `git log` to
      # see exactly what Turva committed, which is the whole point of keeping
      # evidence in Git. A named volume hid them inside Docker.
      #
      # This works because the container runs as uid 1000, matching the default
      # host user. `s/up` creates the directory first, so Docker cannot create
      # it as root and leave it unwritable.
      #
      # On the VPS this is a host path on backed-up storage. It is the one
      # directory that genuinely must survive: the database is rebuildable from
      # these repositories, and they are rebuildable from nothing.
      - ./.turva-data/safety-files:/srv/.turva-data/safety-files
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    # Overridden for development: the autoreloader picks up Python and template
    # changes. Gunicorn (the image default) is what runs in deployment.
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    container_name: "turva-caddy"
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  postgres:
    container_name: "turva-postgres"
    # Pinned deliberately. PGDATA includes the major version
    # (/var/lib/postgresql/18/docker) while the volume is mounted one level up,
    # so a floating tag would silently initialise an empty database inside the
    # existing volume the day PostgreSQL 19 ships. Major upgrades need a
    # dump/restore, not a tag change.
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thisismypassword
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
