# No service sets `container_name`. Compose then names each container after
# the project. Use a unique COMPOSE_PROJECT_NAME for worktrees with the same
# folder name. Every published port reads a TURVA_*_PORT variable so stacks
# can run beside each other; see DEVELOPMENT.md.
services:
  web:
    build:
      # Context is the repository root: the image needs both the Django project
      # and the safety_file library as sibling packages.
      context: .
      dockerfile: app/Dockerfile
    volumes:
      - ./app:/srv/app
      - ./safety_file:/srv/safety_file
      - ./safety-file-templates:/srv/safety-file-templates
      - ./demo:/srv/demo
      - ./manage.py:/srv/manage.py
      - ./pyproject.toml:/srv/pyproject.toml
      # Read-only, and only so the palette test can compare the React theme
      # against the stylesheet. Django does not use any of this. Both
      # interfaces are live while React catches up screen by screen, and a
      # brand colour defined in two places is one that will eventually be two
      # different colours - so the comparison needs to run somewhere, and this
      # is where the suite already runs.
      - ./frontend/src:/srv/frontend/src:ro
      # Read-only, and only so a test can check that two worktrees can each
      # run this stack: no fixed container names, and every published port
      # read from the environment.
      - ./docker-compose.yml:/srv/docker-compose.yml:ro
      # The launcher regressions run a copied script with fake external commands.
      - ./s/up:/srv/s/up:ro
      # Safety file repositories - the system of record.
      #
      # A bind mount, not a named volume, so the repositories are visible on the
      # host: you can `cd .turva-data/safety-files/<slug>` and run `git log` to
      # see exactly what Turva committed, which is the whole point of keeping
      # evidence in Git. A named volume hid them inside Docker.
      #
      # This works because the container runs as uid 1000, matching the default
      # host user. `s/up` creates the directory first, so Docker cannot create
      # it as root and leave it unwritable.
      #
      # On the VPS this is a host path on backed-up storage, the system of
      # record for evidence. Also back up the database: only its
      # safety-file index, not operational identities/access, is rebuildable.
      - ./.turva-data/safety-files:/srv/.turva-data/safety-files
    ports:
      - "${TURVA_WEB_PORT:-8000}:8000"
    env_file:
      - app/.env
    # Overridden for development: the autoreloader picks up Python and template
    # changes. Gunicorn (the image default) is what runs in deployment.
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      postgres:
        condition: service_healthy
    # Without this, `docker compose up --wait` returns as soon as the container
    # is running, which is before Django has bound the port - so the stack
    # reports ready and the next request gets a 502 from Caddy.
    #
    # /healthz/ touches the database, so a passing check means the application
    # can actually serve, not merely that a process exists. urllib rather than
    # curl because the slim image has no curl, and adding one to answer a
    # healthcheck is a poor trade.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=4).status == 200 else 1)",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      # Source bind-mounted so Vite's hot reload sees edits without a rebuild.
      - ./frontend:/srv/frontend
      # An anonymous volume over node_modules, so the container keeps the
      # modules installed for *its* platform rather than having them masked by
      # whatever the host installed. Without this, a host `npm install` on a
      # different architecture breaks the container silently.
      - /srv/frontend/node_modules
    ports:
      - "${TURVA_FRONTEND_PORT:-5173}:5173"
    environment:
      # Vite proxies /api to Django, so the browser sees one origin and the
      # session and CSRF cookies behave exactly as they will in deployment.
      TURVA_API: http://web:8000
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2.11.8-alpine
    ports:
      - "${TURVA_HTTP_PORT:-80}:80"
      - "${TURVA_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  postgres:
    # Pinned deliberately. PGDATA includes the major version
    # (/var/lib/postgresql/18/docker) while the volume is mounted one level up,
    # so a floating tag would silently initialise an empty database inside the
    # existing volume the day PostgreSQL 19 ships. Major upgrades need a
    # dump/restore, not a tag change.
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thisismypassword
      POSTGRES_DB: postgres
    ports:
      - "${TURVA_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
