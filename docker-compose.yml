services:
  api:
    container_name: "turva-api"
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    env_file:
      - api/.env
    environment:
      - PYTHONPATH=/app
      - DEBUG=true
    # Uvicorn connects to the database during startup and exits if it cannot,
    # so it must not start before PostgreSQL accepts connections. Without this
    # the stack came up correctly only by timing luck.
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # docs:
  #   build:
  #     context: .
  #     dockerfile: docs/Dockerfile
  #   volumes:
  #     - ./docs:/docs
  #   ports:
  #     - "8001:8001"
  #   command: zensical serve -a 0.0.0.0:8001

  caddy:
    container_name: "turva-caddy"
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      # - docs

  postgres:
    container_name: "turva-postgres"
    # Pinned deliberately. PGDATA includes the major version
    # (/var/lib/postgresql/18/docker) while the volume is mounted one level up,
    # so a floating tag would silently initialise an empty database inside the
    # existing volume the day PostgreSQL 19 ships. Major upgrades need a
    # dump/restore, not a tag change.
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thisismypassword
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
