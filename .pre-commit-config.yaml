repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(svg|cjs)$
      - id: end-of-file-fixer
        exclude: \.(svg|cjs)$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.3.0
    hooks:
      - id: cspell
        name: Spell check with cspell
        args: ["--config", "cspell.config.json"]
        types: [markdown]

  # pre-commit/mirrors-prettier was archived in April 2024 and the pin there was
  # a prettier 4 alpha. rbubley/mirrors-prettier is the maintained mirror and
  # tracks stable prettier releases.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      # HTML is deliberately excluded - Prettier mangles Django and Jinja2
      # `{% %}` and `{{ }}` syntax. Do not add `html` to types_or.
      - id: prettier
        types_or: [markdown, json, yaml, css]
        args: [--write]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # No `files:` filter: ruff.toml owns the include/exclude rules, so the
      # hook and a bare `ruff check .` agree. The previous `^api/` filter meant
      # demo/, safety_file/ and manage.py were never linted by pre-commit.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
