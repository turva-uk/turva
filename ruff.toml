line-length = 100
target-version = "py314"

# The repository root is the import root: `app` (the Django project) and
# `safety_file` (the storage library) are sibling top-level packages, and
# manage.py sits beside them. Without this, isort shuffles them into the
# third-party block.
src = ["."]

exclude = [
  ".venv",
  ".turva-data",
  # Generated documentation output.
  "docs/site",
  "docs/.cache",
  "staticfiles",
  # A historical record. Ruff formats Python code blocks inside Markdown, and
  # rewriting archived specifications would falsify what they said at the time.
  "specifications/archive",
]

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[lint.isort]
known-first-party = ["app", "demo", "safety_file"]

[lint.per-file-ignores]
# Django migrations are generated, and reformatting them creates a diff against
# what Django would write next time.
"app/*/migrations/*.py" = ["E501", "I001"]
