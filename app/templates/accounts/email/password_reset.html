<!doctype html>
<html lang="en-GB">
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #1a1a2e">
    <p>Hello {{ user.first_name }},</p>

    <p>
      Someone asked to reset the password for your Turva account. If that was
      you,
      <a
        href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}"
        >choose a new password</a
      >.
    </p>

    <p>The link is valid for a limited time and can be used once.</p>

    <p>
      If you did not ask for this, you can ignore this email. Your password will
      not change.
    </p>

    <p>&mdash; Turva</p>
  </body>
</html>
